name: CS2 Notifier

on:
  schedule:
    - cron: '*/30 * * * *'    # toutes les 30 min (UTC ; retards possibles, sans importance ici)
  workflow_dispatch:          # bouton "Run workflow" pour tester a la main

permissions:
  contents: write             # necessaire pour committer state.json (anti-spam + keepalive)

concurrency:
  group: cs2-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install curl_cffi

      - name: Run notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEBUG: ${{ vars.DEBUG }}     # mets une variable DEBUG=1 pour le mode test
        run: python cs2_notifier.py

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push
